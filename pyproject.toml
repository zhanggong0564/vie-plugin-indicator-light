[build-system]
requires = ["setuptools>=61", "Cython>=3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vie-plugin-indicator-light"
version = "0.1.6"
description = "VIE 指示灯检测插件"
requires-python = ">=3.10"
# 生产环境应声明依赖 "vie-framework"；in-repo demo 用 --no-deps 安装，
# 框架的 services/schemas/routers 由仓库根目录在 sys.path 上提供。
dependencies = ["vie-framework", "chromadb==1.5.9"]

[project.entry-points."vie.plugins"]
indicator_light = "vie_plugin_indicator_light.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["vie_plugin_indicator_light*"]
